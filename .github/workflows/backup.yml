name: Monthly off-platform backup

# A full SQL dump of production on the 1st of every month, kept as an encrypted
# artifact for 90 days, so the business never depends on Supabase alone.
# Supabase's own daily backups remain the first line of recovery.
on:
  schedule:
    - cron: "30 20 1 * *" # 02:00 Asia/Colombo on the 1st
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    if: vars.PRODUCTION_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check settings (never prints the values)
        env:
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          fail=0
          [ -n "$DB_PASSWORD" ] || { echo "::error::PRODUCTION_DB_PASSWORD is empty or missing"; fail=1; }
          [ "$DB_PASSWORD" = "$(printf '%s' "$DB_PASSWORD" | tr -d '[:space:]')" ] || { echo "::error::PRODUCTION_DB_PASSWORD contains spaces or line breaks"; fail=1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::BACKUP_PASSPHRASE is empty or missing"; fail=1; }
          echo "password length: ${#DB_PASSWORD}"
          exit $fail
      - name: Dump schema, data and roles
        env:
          REF: ${{ vars.PRODUCTION_PROJECT_REF }}
          # Session pooler for the project's region (Singapore). The pooler needs
          # the user written as postgres.<project ref>, so pass a full URL.
          POOLER_HOST: ${{ vars.PRODUCTION_POOLER_HOST || 'aws-0-ap-southeast-1.pooler.supabase.com' }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          enc=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
          echo "::add-mask::$enc"
          DB_URL="postgresql://postgres.${REF}:${enc}@${POOLER_HOST}:5432/postgres"
          echo "::add-mask::$DB_URL"
          mkdir backup
          npx supabase db dump --remote="$DB_URL" -f backup/roles.sql --role-only
          npx supabase db dump --remote="$DB_URL" -f backup/schema.sql
          npx supabase db dump --remote="$DB_URL" -f backup/data.sql --use-copy --data-only
          ls -la backup
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          tar czf "axe-db-$stamp.tgz" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 "axe-db-$stamp.tgz"
          rm -rf backup "axe-db-$stamp.tgz"
      - uses: actions/upload-artifact@v5
        with:
          name: axe-db-backup
          path: axe-db-*.tgz.gpg
          retention-days: 90
