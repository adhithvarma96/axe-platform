name: Monthly off-platform backup

# A full SQL dump of production on the 1st of every month, kept as an encrypted
# artifact for 90 days, so the business never depends on Supabase alone.
# Supabase's own daily backups remain the first line of recovery.
on:
  schedule:
    - cron: "30 20 1 * *" # 02:00 Asia/Colombo on the 1st
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    if: vars.PRODUCTION_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dump schema, data and roles
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase link --project-ref "${{ vars.PRODUCTION_PROJECT_REF }}"
          mkdir backup
          npx supabase db dump --linked -f backup/roles.sql --role-only
          npx supabase db dump --linked -f backup/schema.sql
          npx supabase db dump --linked -f backup/data.sql --use-copy --data-only
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          tar czf "axe-db-$stamp.tgz" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 "axe-db-$stamp.tgz"
          rm -rf backup "axe-db-$stamp.tgz"
      - uses: actions/upload-artifact@v5
        with:
          name: axe-db-backup
          path: axe-db-*.tgz.gpg
          retention-days: 90
