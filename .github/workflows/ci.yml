name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Runs every migration on a fresh Postgres and checks RLS, audit, IDs, roles.
      - run: npm test
      - run: npm run build

  # On main only: apply new migrations to staging. Production is applied by hand
  # after Adhith approves staging (see docs/RUNBOOK.md).
  migrate-staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # The CLI's temporary login role is not reliable from GitHub runners,
      # so connect with the staging database password.
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same Supabase CLI version as package.json.
      - run: npx supabase link --project-ref "${{ vars.STAGING_PROJECT_REF }}"
      - run: npx supabase db push --remote --yes
